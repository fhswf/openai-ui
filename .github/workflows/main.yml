name: Build & Deploy

on:
  push:
    branches:
      - "main"
  milestone:
    types:
      - closed
  workflow_dispatch:
    inputs:
      dependabot_pr:
        description: Dependabot PR URL to wait for before checking releases
        required: false
        type: string
      release_tag:
        description: Existing Release Please tag to rebuild, for example openai-ui-v0.62.1
        required: false
        type: string

jobs:
  wait-for-dependabot-merge:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dependabot_pr != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      pull-requests: read
    outputs:
      merged: ${{ steps.wait.outputs.merged }}
    steps:
      - name: Wait for the Dependabot PR to merge
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ inputs.dependabot_pr }}
        run: |
          for attempt in $(seq 1 120); do
            state=$(gh pr view "$PR_URL" --json state,mergedAt --jq 'if .mergedAt != null then "merged" elif .state == "CLOSED" then "closed" else "open" end')
            if [[ "$state" == "merged" ]]; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$state" == "closed" ]]; then
              echo "merged=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for Dependabot PR $PR_URL to merge" >&2
          exit 1

  release:
    needs: wait-for-dependabot-merge
    if: >-
      ${{ always() && inputs.release_tag == '' && (needs.wait-for-dependabot-merge.result == 'skipped' ||
      (needs.wait-for-dependabot-merge.result == 'success' &&
      needs.wait-for-dependabot-merge.outputs.merged == 'true')) }}
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    name: Release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create GitHub App token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      
  build:
    needs: release
    if: >-
      ${{ !cancelled() && (needs.release.result == 'success' ||
      (inputs.release_tag != '' && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: ci-install token
        uses: actions/create-github-app-token@v3
        id: cicd
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.cicd.outputs.token }}

      - name: Validate manual release tag
        id: manual-release
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^openai-ui-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must be an existing tag such as openai-ui-v0.62.1"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::Release tag $RELEASE_TAG was not found in the repository"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"


      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/fhswf/openai-ui            
          tags: |
            type=sha,prefix=sha-,format=short,enable=true,priority=1100
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag_name }},enable=${{ needs.release.outputs.release_created == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag_name }},enable=${{ needs.release.outputs.release_created == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag_name }},enable=${{ needs.release.outputs.release_created == 'true' }}
            type=raw,value=${{ needs.release.outputs.tag_name }},enable=${{ needs.release.outputs.release_created == 'true' }}
            type=raw,value=${{ steps.manual-release.outputs.tag }},enable=${{ steps.manual-release.outputs.tag != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.manual-release.outputs.tag || (needs.release.outputs.release_created == 'true' && needs.release.outputs.tag_name) || github.sha }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update Staging Kustomize Image
        run: |
          cd k8s/overlays/staging
          kustomize edit set image ghcr.io/fhswf/openai-ui=ghcr.io/fhswf/openai-ui:sha-$(echo ${{ github.sha }} | cut -c1-7)

      - name: Update Prod Kustomize Image
        if: ${{ needs.release.outputs.release_created == 'true' || steps.manual-release.outputs.tag != '' }}
        env:
          RELEASE_TAG: ${{ steps.manual-release.outputs.tag || needs.release.outputs.tag_name }}
        run: |
          cd k8s/overlays/prod
          kustomize edit set image ghcr.io/fhswf/openai-ui=ghcr.io/fhswf/openai-ui:"$RELEASE_TAG"

      - name: Commit Kustomize Updates
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update kustomize images [skip ci]"
          file_pattern: "k8s/overlays/**/kustomization.yaml"
   
