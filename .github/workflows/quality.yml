name: Quality Gate

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


env:
  PLAYWRIGHT_TEST_BASE_URL: http://localhost:5173
  PLAYWRIGHT_PREBUILT_DIST: "1"
  VITE_LOGIN_URL: /api/login
  VITE_LOGOUT_URL: /api/logout
  VITE_API_BASE_URL: /api/v1
  VITE_USER_URL: /api/user
  VITE_PROXY_URL: https://proxy.gawron.cloud/api
  VITE_DASHBOARD_URL: /api/dashboard

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - run: corepack enable && corepack prepare yarn@stable --activate
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: 'yarn'
        cache-dependency-path: '**/yarn.lock'
    - name: Install dependencies
      run: yarn install --immutable
    - name: Build app
      run: yarn build
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        retention-days: 1

  unit-tests:
    name: Unit tests
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
    - run: corepack enable && corepack prepare yarn@stable --activate
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: 'yarn'
        cache-dependency-path: '**/yarn.lock'
    - name: Install dependencies
      run: yarn install --immutable
    - name: Run MCP state regression tests
      run: >-
        yarn test:unit
        src/chat/utils/__tests__/mcpServiceHelpers.test.ts
        src/chat/utils/__tests__/index.test.ts
        src/chat/context/__tests__/persistence.test.tsx
        --reporter=default
        --reporter=json
        --outputFile=unit-test-results.json
    - name: Check i18n translation completeness
      run: yarn test:i18n
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: unit-test-results
        path: unit-test-results.json
        if-no-files-found: ignore
        retention-days: 30

  playwright-browsers:
    name: Install Playwright browsers
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - run: corepack enable && corepack prepare yarn@stable --activate
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: 'yarn'
        cache-dependency-path: '**/yarn.lock'
    - name: Install dependencies
      run: yarn install --immutable
    - name: Get Playwright version
      run: echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_ENV
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium firefox webkit chrome msedge

  playwright-auth:
    name: Playwright Auth Setup
    timeout-minutes: 15
    needs: [build, playwright-browsers]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - run: corepack enable && corepack prepare yarn@stable --activate
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: 'yarn'
        cache-dependency-path: '**/yarn.lock'
    - name: Install dependencies
      run: yarn install --immutable
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Get Playwright version
      run: echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_ENV
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium
    - name: Install Chromium if the browser cache is unavailable
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
    - name: Create authenticated storage state
      run: npx playwright test --project=setup
      env:
        PLAYWRIGHT_JSON_OUTPUT: playwright-report/results-auth.json
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-auth-state
        path: playwright/.auth/user.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: playwright-report-auth
        path: playwright-report/
        retention-days: 30

  playwright-chromium:
    name: Playwright Chromium ${{ matrix.shard }}/${{ matrix.total_shards }}
    timeout-minutes: 35
    needs: [build, playwright-auth]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total_shards: [3]
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - run: corepack enable && corepack prepare yarn@stable --activate
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: 'yarn'
        cache-dependency-path: '**/yarn.lock'
    - name: Install dependencies
      run: yarn install --immutable
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - uses: actions/download-artifact@v8
      with:
        name: playwright-auth-state
        path: playwright/.auth/
    - name: Get Playwright version
      run: echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_ENV
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium
    - name: Install Chromium if the browser cache is unavailable
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
    - name: Run Chromium shard
      run: npx playwright test --no-deps --project=chromium --shard=${{ matrix.shard }}/${{ matrix.total_shards }}
      env:
        PLAYWRIGHT_JSON_OUTPUT: playwright-report/results-chromium-${{ matrix.shard }}.json
    - name: Collect Playwright JSON
      if: ${{ !cancelled() }}
      run: |
        mkdir -p playwright-results
        if [ -f playwright-report/results-chromium-${{ matrix.shard }}.json ]; then
          cp playwright-report/results-chromium-${{ matrix.shard }}.json playwright-results/chromium-${{ matrix.shard }}.json
        fi
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-chromium-${{ matrix.shard }}
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-results-chromium-${{ matrix.shard }}
        path: playwright-results/
        retention-days: 30
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: nyc-output-chromium-${{ matrix.shard }}
        path: .nyc_output/
        include-hidden-files: true
        retention-days: 1

  playwright-smoke:
    name: Playwright Cross-Browser Smoke
    timeout-minutes: 35
    needs: [build, playwright-auth]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - run: corepack enable && corepack prepare yarn@stable --activate
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: 'yarn'
        cache-dependency-path: '**/yarn.lock'
    - name: Install dependencies
      run: yarn install --immutable
    - uses: actions/download-artifact@v8  
      with:
        name: dist
        path: dist/
    - uses: actions/download-artifact@v8
      with:
        name: playwright-auth-state
        path: playwright/.auth/
    - name: Get Playwright version
      run: echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_ENV
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium firefox webkit
    - name: Install Playwright browsers if the browser cache is unavailable
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium firefox webkit chrome msedge
    - name: Run cross-browser smoke
      run: npx playwright test --no-deps --project=firefox --project=webkit --project='Mobile Chrome' --project='Mobile Safari' --project='Microsoft Edge' --project='Google Chrome'
      env:
        PLAYWRIGHT_JSON_OUTPUT: playwright-report/results-smoke.json
    - name: Collect Playwright JSON
      if: ${{ !cancelled() }}
      run: |
        mkdir -p playwright-results
        if [ -f playwright-report/results-smoke.json ]; then
          cp playwright-report/results-smoke.json playwright-results/smoke.json
        fi
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-smoke
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-results-smoke
        path: playwright-results/
        retention-days: 30
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: nyc-output-smoke
        path: .nyc_output/
        include-hidden-files: true
        retention-days: 1

  quality-summary:
    name: Quality Summary
    needs: [unit-tests, playwright-chromium, playwright-smoke]
    runs-on: ubuntu-24.04
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - run: corepack enable && corepack prepare yarn@stable --activate
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: 'yarn'
        cache-dependency-path: '**/yarn.lock'
    - name: Install dependencies
      run: yarn install --immutable
    - uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        pattern: nyc-output-*
        path: .nyc_output/
        merge-multiple: true
    - name: Generate coverage report
      run: |
        if [ -d .nyc_output ] && [ "$(ls -A .nyc_output)" ]; then
          npx nyc report --reporter=lcov --report-dir=coverage
        else
          echo "No coverage files found in .nyc_output, skipping report generation."
        fi
    - uses: actions/download-artifact@v8
      if: github.event_name == 'pull_request'
      continue-on-error: true
      with:
        pattern: playwright-results-*
        path: playwright-results/
        merge-multiple: true
    - name: Download unit-test results
      if: github.event_name == 'pull_request'
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: unit-test-results
        path: unit-test-results/
    - name: Comment Test Report on PR
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      env:
        UNIT_TEST_STATUS: ${{ needs.unit-tests.result }}
        PLAYWRIGHT_CHROMIUM_STATUS: ${{ needs.playwright-chromium.result }}
        PLAYWRIGHT_SMOKE_STATUS: ${{ needs.playwright-smoke.result }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const unitResultsDir = 'unit-test-results';
          const playwrightResultsDir = 'playwright-results';
          const unitTotals = {
            passed: 0,
            failed: 0,
            skipped: 0,
            total: 0,
            failedSuites: 0,
            failures: [],
          };
          const playwrightTotals = {
            expected: 0,
            unexpected: 0,
            flaky: 0,
            skipped: 0,
            duration: 0,
            failures: [],
          };

          if (fs.existsSync(unitResultsDir)) {
            for (const file of fs.readdirSync(unitResultsDir).filter((name) => name.endsWith('.json'))) {
              const report = JSON.parse(fs.readFileSync(path.join(unitResultsDir, file), 'utf8'));
              unitTotals.passed += report.numPassedTests || 0;
              unitTotals.failed += report.numFailedTests || 0;
              unitTotals.skipped += (report.numPendingTests || 0) + (report.numTodoTests || 0);
              unitTotals.total += report.numTotalTests || 0;
              unitTotals.failedSuites += report.numFailedTestSuites || 0;

              for (const testFile of report.testResults || []) {
                let foundFailedAssertion = false;
                for (const assertion of testFile.assertionResults || []) {
                  if (assertion.status === 'failed') {
                    foundFailedAssertion = true;
                    unitTotals.failures.push({
                      name: assertion.fullName || assertion.title || testFile.name,
                      file: path.relative(process.cwd(), testFile.name),
                      error: (assertion.failureMessages || []).join('\n'),
                    });
                  }
                }
                if (testFile.status === 'failed' && !foundFailedAssertion) {
                  unitTotals.failures.push({
                    name: testFile.name,
                    file: path.relative(process.cwd(), testFile.name),
                    error: testFile.message || 'Test file failed before assertions ran.',
                  });
                }
              }
            }
          }

          function collectPlaywrightFailures(suite, parents = [], parentFile = '') {
            const suiteTitles = suite.title ? [...parents, suite.title] : parents;
            const suiteFile = suite.file || parentFile;
            for (const spec of suite.specs || []) {
              for (const test of spec.tests || []) {
                if (test.outcome !== 'unexpected') continue;
                const failedResults = (test.results || []).filter((result) =>
                  ['failed', 'timedOut', 'interrupted'].includes(result.status)
                );
                const errors = failedResults.flatMap((result) =>
                  (result.errors || (result.error ? [result.error] : [])).map((error) =>
                    [error.message, error.stack].filter(Boolean).join('\n')
                  )
                );
                playwrightTotals.failures.push({
                  name: [...suiteTitles, spec.title, test.projectName].filter(Boolean).join(' / '),
                  file: spec.file || suiteFile,
                  line: spec.line || spec.location?.line,
                  error: errors.join('\n\n') || 'No error details were included in the Playwright JSON report.',
                });
              }
            }
            for (const child of suite.suites || []) {
              collectPlaywrightFailures(child, suiteTitles, suiteFile);
            }
          }

          let playwrightReportCount = 0;
          if (fs.existsSync(playwrightResultsDir)) {
            for (const file of fs.readdirSync(playwrightResultsDir).filter((name) => name.endsWith('.json'))) {
              const report = JSON.parse(fs.readFileSync(path.join(playwrightResultsDir, file), 'utf8'));
              const stats = report.stats || {};
              playwrightReportCount++;
              playwrightTotals.expected += stats.expected || 0;
              playwrightTotals.unexpected += stats.unexpected || 0;
              playwrightTotals.flaky += stats.flaky || 0;
              playwrightTotals.skipped += stats.skipped || 0;
              playwrightTotals.duration += stats.duration || 0;
              for (const suite of report.suites || []) {
                collectPlaywrightFailures(suite);
              }
            }
          }

          const unitStatus = process.env.UNIT_TEST_STATUS || 'unknown';
          const chromiumStatus = process.env.PLAYWRIGHT_CHROMIUM_STATUS || 'unknown';
          const smokeStatus = process.env.PLAYWRIGHT_SMOKE_STATUS || 'unknown';
          let body = `### CI Test Results\n\n`;
          body += `- **Unit tests (MCP state regression):** ${unitStatus} — ${unitTotals.passed} passed, ${unitTotals.failed} failed, ${unitTotals.skipped} skipped (${unitTotals.total} total; ${unitTotals.failedSuites} failed suites)\n`;
          body += `- **Playwright Chromium:** ${chromiumStatus}\n`;
          body += `- **Playwright cross-browser smoke:** ${smokeStatus} — ${playwrightTotals.expected} passed, ${playwrightTotals.unexpected} failed, ${playwrightTotals.flaky} flaky, ${playwrightTotals.skipped} skipped\n`;
          body += `- **Playwright runtime across jobs:** ${(playwrightTotals.duration / 1000).toFixed(1)}s\n\n`;
          if (unitStatus !== 'success' && unitTotals.total === 0) {
            body += `Unit-test details were unavailable in the uploaded JSON report; see the workflow run for the failing step output.\n\n`;
          }
          if (playwrightReportCount === 0) {
            body += `Playwright JSON reports were unavailable; see the workflow run for job logs and uploaded reports.\n\n`;
          }

          function escapeInline(value) {
            return String(value).replace(/[\\`*_{}\[\]()#+.!|>~-]/g, '\\$&');
          }

          function appendFailures(label, failures) {
            if (failures.length === 0) return;
            body += `<details><summary>${label} (${failures.length})</summary>\n\n`;
            for (const failure of failures.slice(0, 10)) {
              const location = [failure.file, failure.line].filter(Boolean).join(':');
              body += `- **${escapeInline(failure.name)}**${location ? ` — \`${escapeInline(location)}\`` : ''}\n`;
              if (failure.error) {
                const error = String(failure.error)
                  .replace(/```/g, '`\\`\\``')
                  .slice(0, 2000);
                body += `\n  \`\`\`text\n  ${error.replace(/\n/g, '\n  ')}\n  \`\`\`\n`;
              }
            }
            if (failures.length > 10) body += `\n- ...and ${failures.length - 10} more failures.\n`;
            body += `\n</details>\n`;
          }

          appendFailures('Failed unit tests', unitTotals.failures);
          appendFailures('Failed Playwright tests', playwrightTotals.failures);
          body += `\n[View workflow run and test artifacts](${process.env.RUN_URL})\n\n<!-- quality-test-summary -->`;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find((comment) =>
            comment.body?.includes('<!-- quality-test-summary -->')
          );
          const commentOptions = {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body,
          };
          if (existing) {
            await github.rest.issues.updateComment({
              ...commentOptions,
              comment_id: existing.id,
            });
          } else {
            await github.rest.issues.createComment(commentOptions);
          }
    - name: SonarQube
      uses: sonarsource/sonarqube-scan-action@v8
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
