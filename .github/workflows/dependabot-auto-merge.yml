name: Dependabot auto-merge
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Nur ausführen, wenn der PR wirklich von Dependabot kommt
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot Metadaten abrufen
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Optional: Nur Patch- und Minor-Updates automatisch mergen (kein Major!)
      - name: Auto-Merge aktivieren
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      # Auto-merges use GITHUB_TOKEN, which may suppress the push event that
      # normally starts Release Please. Dispatch it separately and wait until
      # this PR has merged before checking for releases.
      - name: Trigger Release Please after auto-merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh workflow run main.yml --ref main --field dependabot_pr="$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
